      post: |
        # Was the Milky Way a chain galaxy? 

        Using the [IGIMF](https://github.com/hmahani/IGIMF) theory to constrain the thin-disc star formation history and mass

        ###### The  environment-dependent initial mass function 
        {:data-align="center"}

        The initial mass function (IMF) denotes the distribution of star masses at the onset of their formation within a star formation event. 
        Although studies of the Local Group have indicated that a consistent IMF effectively describes straightforward stellar populations, 
        such as globular clusters, it is expected that the IMF varies and becomes contingent on the environment within composite populations, such as galaxies.

        ***

        ##### Results
        
        In this study, we investigate the shape of the present-day mass function (PDMF) by employing both the canonical IMF and the IGIMF 
        theory with a time-dependent star formation rate (SFR). By examining the Galactic-field PDMF for stars with masses greater than 1 M&#8857; and determining 
        the normalization for low-mass stars, we can effectively constrain the star-formation history of the Milky Way and thereby estimate its current SFR. 
        Additionally, this analysis allows us to determine the total mass of stars in the Galactic thin disc.

        To explore the impact of key parameters, namely the e-folding time-scale (&tau;) and total disc mass, on the present-day properties of the Galactic thin disc, 
        we conducted a series of calculations using different models. Through this approach, we can refine our understanding of the Milky Way's thin disc properties, 
        including its current SFR, mass-to-light ratio, and overall stellar mass. Based on our investigations, we draw the following main conclusions:

        - Both the IGIMF and the canonical IMF effectively reproduce the Galactic PDMF. However, when constraining the SFR to decline by a factor of 2–7, 
        the degeneracy breaks, and the IGIMF model outperforms in replicating the MW PDMF.
        - Considering the canonical IMF and IGIMF, models constructed with &tau; = 2.8 Gyr provide the best fit, suggesting an exponentially declining Milky Way SFR. 
        The similarity in &tau; values between IMF and IGIMF models arises from the MW being an intermediate-mass galaxy, where the IGIMF resembles the canonical IMF, 
        while significant differences occur in dwarf galaxies with low SFRs or massive galaxies with high SFRs.
        - Under the IGIMF theory, the Milky Way, having had a higher SFR approximately 10 Gyr ago, might have been populated by embedded clusters spanning masses up to 
        a few million M&#8857;, potentially giving it the appearance of a chain galaxy.


      

        

        

