    - type: id_quote
      project_name: "SEDust: SED fitting of evolved stars"
      project_excerpt: "A DUSTY-based pipeline to derive luminosities and mass-loss rates from AGB-star SEDs"
      img: ":Andix.png"
      img_title: "Illustrative evolved-star research project"
      date: "2026-11-15"
      post: |
        SEDust is a reproducible pipeline for fitting multiwavelength spectral energy distributions of AGB stars with DUSTY model grids. It is designed to infer stellar luminosities, circumstellar optical depths, and mass-loss rates. The code is available on [GitHub](https://github.com/hmahani/SEDust), with a [Zenodo record](https://doi.org/10.5281/zenodo.22858441).

    - type: id_quote
      project_name: "MCM-SEDust: Bayesian dust inference"
      project_excerpt: "An MCMC framework for posterior inference of circumstellar dust properties"
      img: ":UCD.jpg"
      img_title: "Research modelling"
      date: "2026-11-15"
      post: |
        MCM-SEDust extends SED fitting with Bayesian inference using ensemble MCMC sampling. The framework is designed to quantify posterior uncertainties and support flexible assumptions about circumstellar dust composition. The associated manuscript is in preparation.

    - type: id_phot
      project_name: "Dust production in IC 10"
      project_excerpt: "Multiwavelength analysis of long-period variables and dusty evolved stars in a star-forming dwarf galaxy"
      img: ":Andix.png"
      img_title: "Resolved stellar population research"
      date: "2026-11-15"
      post: |
        This project combines optical monitoring and infrared photometry to investigate the evolved stellar population and dust-production budget of IC 10. The analysis brings together LPV candidates and multiwavelength data, with SED-based estimates of circumstellar mass loss.

