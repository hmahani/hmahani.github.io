    - type: id_sps
      project_name: "Mass-to-light ratio of UCDs"
      project_excerpt: "Top-heavy IMF: A Riveting Proposal to Untangle the Mystery of Ultra-Compact Dwarf Galaxies' Anomalous Mass-to-Luminosity Ratio"
      img: ":UCD.jpg"
      img_title: "peakpx.com/en/hd-wallpaper-desktop-avecz"
      date: "2021-02-10"
      post: |
        # Do ultracompact dwarf galaxies form monolithically or as merged star cluster complexes?
        
        We examine the physical characteristics of Ultra-Compact Dwarf Galaxies (UCDs) at various evolutionary phases, considering diverse initial stellar 
        masses and adopting an Integrated Galactic Initial Mass Function (IMF) theory where the IMF can vary systematically based on metallicity and density. 
        While a fixed, universal IMF fails to replicate the observed high Mass-to-Luminosity (M/L) ratios of UCDs, an empirically derived IMF that changes with 
        density and metallicity aligns with observations. The incorporation of UCD-mass-dependent retention fractions for dark remnants further enhances this agreement. 
        N-body simulations applied to young UCDs demonstrate that the same initial conditions explaining M/L ratios also capture the observed relationship between half-mass 
        radii and present-day masses. These findings imply that UCDs with elevated M/L ratios may have formed monolithically with concentrated remnant-mass components, while 
        those with lower M/L values could be the result of merged star cluster complexes. 
        For more detailed information, please refer to the [paper](https://academic.oup.com/mnras/article-abstract/502/4/5185/6132256?redirectedFrom=fulltext).

        ![Various models employing distinct initial mass functions are compared with observational data](:UCD_IMF.jpeg){:data-align="center"}

    # quote
    - type: id_phot
      project_name: "Andromeda IX"
      project_excerpt: "Unlocking Secrets of the Nearest Satellite to M31: A Photometric Exploration of Star Formation History and Dust Production"
      img: ":Andix.png"
      img_title: "www.craiyon.com/image/ipKz3VSOT-qZauExZmBwBw"
      date: "2023-05-08"
      post: |
        # The Isaac Newton Telescope Monitoring Survey of Local Group Dwarf Galaxies. VI. The Star Formation History and Dust Production in Andromeda IX
        
        From June 21, 2015, to October 6, 2017, a series of nine observations were conducted to investigate the characteristics of And IX, a dwarf spheroidal 
        satellite galaxy of M31. The observations utilized the 2.5 m Wide Field Camera of the Isaac Newton Telescope with Sloan i and Harris V filters. Employing 
        DAOPHOT/ALLSTAR software, 54 candidates on the Asymptotic Giant Branch (AGB) were detected within two half-light radii (approximately 5′) of And IX, with around 
        50 of them identified as Long Period Variables (LPVs) exhibiting amplitudei > 0.2 mag. To assess galaxy evolution, Star Formation Rates (SFRs) were calculated for 
        different metallicities within two half-light radii. Taking into account temperature and radius variations, LPVs undergo substantial mass loss in the form of stellar 
        wind. Mass-loss rates were determined using multiwavelength data from INT, Spitzer, SDSS, and WISE. The detailed findings can be accessed in the corresponding
        [paper](https://iopscience.iop.org/article/10.3847/1538-4357/acbbc9).


        ![CMD of the Andromeda IX galaxy](:AndIX_CMD.jpg){:data-align="center"}


        
